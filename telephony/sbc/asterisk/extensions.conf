; CallBot SBC dialplan. Only ${VARS} in UPPER_SNAKE listed in render-and-run.sh are replaced at start;
; Asterisk's own ${EXTEN}, ${NUM} etc. are left alone.

[general]
static=yes
writeprotect=yes

[from-vapi]
; Fraud guard: only Pakistani numbers (+92…) may be dialled through the local trunk.
exten => _+92X.,1,NoOp(CallBot → ${EXTEN})
 same => n,Set(GROUP()=callbot)
 same => n,GotoIf($[${GROUP_COUNT(callbot)} > ${MAX_CHANNELS}]?full)
 ; +923001234567 → 03001234567. Change if the carrier wants 92… or +92… (ask them).
 same => n,Set(NUM=0${EXTEN:3})
 same => n,Set(CALLERID(num)=${UNIVERSITY_CALLER_ID_LOCAL})
 same => n,Dial(PJSIP/${NUM}@carrier,60)
 same => n,Hangup(${HANGUPCAUSE})
 same => n(full),NoOp(Channel limit reached)
 same => n,Congestion()

; Same, for when Vapi sends numbers without the leading +.
exten => _92X.,1,Goto(from-vapi,+${EXTEN},1)

; Anything else is rejected.
exten => _X.,1,NoOp(Rejected non-PK destination ${EXTEN})
 same => n,Hangup(21)

[from-carrier]
; Inbound calls are not used in v1.
exten => _X.,1,Hangup(21)
