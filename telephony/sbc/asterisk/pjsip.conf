; CallBot SBC — PJSIP template. ${VARS} are filled from .env by render-and-run.sh at container start.
; Leg A: Vapi → SBC (Vapi's BYO SIP trunk sends INVITEs here, digest-authenticated).
; Leg B: SBC → licensed Pakistani operator trunk, presenting the university UAN as caller ID.

[global]
type=global
user_agent=CallBot-SBC

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
external_media_address=${SBC_PUBLIC_IP}
external_signaling_address=${SBC_PUBLIC_IP}
local_net=${SBC_LOCAL_NET}

; ---------------- Leg A: Vapi ----------------
[vapi]
type=endpoint
context=from-vapi
disallow=all
allow=ulaw,alaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
auth=vapi-auth
identify_by=ip,username

[vapi-auth]
type=auth
auth_type=userpass
username=${SBC_SIP_USERNAME}
password=${SBC_SIP_PASSWORD}

; Vapi's SIP signalling IPs (comma-separated, from Vapi docs/support). Only these may reach the vapi endpoint.
[vapi-identify]
type=identify
endpoint=vapi
match=${VAPI_SIP_IPS}

; ---------------- Leg B: carrier ----------------
[carrier]
type=endpoint
context=from-carrier
disallow=all
allow=ulaw,alaw
direct_media=no
rtp_symmetric=yes
aors=carrier
outbound_auth=carrier-auth
from_user=${UNIVERSITY_CALLER_ID_LOCAL}
send_pai=yes
trust_id_outbound=yes

[carrier]
type=aor
contact=sip:${CARRIER_HOST}:${CARRIER_PORT}
qualify_frequency=60

[carrier-auth]
type=auth
auth_type=userpass
username=${CARRIER_USERNAME}
password=${CARRIER_PASSWORD}

[carrier-identify]
type=identify
endpoint=carrier
match=${CARRIER_HOST}

; If the carrier requires registration (ask them), uncomment:
;[carrier-reg]
;type=registration
;outbound_auth=carrier-auth
;server_uri=sip:${CARRIER_HOST}:${CARRIER_PORT}
;client_uri=sip:${CARRIER_USERNAME}@${CARRIER_HOST}
;retry_interval=60
